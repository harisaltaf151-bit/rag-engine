<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="HarryRAG architecture pipeline" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#121c3a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#e2e8f0">How HarryRAG works</text>

  <!-- connector (drawn first so boxes cover it) -->
  <line x1="120" y1="175" x2="1080" y2="175" stroke="url(#line)" stroke-width="3" stroke-dasharray="8 8" opacity="0.7">
    <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <circle r="7" fill="#fbbf24">
    <animateMotion dur="5s" repeatCount="indefinite" path="M120 175 H1080"/>
  </circle>
  <circle r="14" fill="#fbbf24" opacity="0.25">
    <animateMotion dur="5s" repeatCount="indefinite" path="M120 175 H1080"/>
  </circle>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- 1 Upload -->
    <rect x="30" y="125" width="180" height="100" rx="14" fill="#111827" stroke="#60a5fa" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="5s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <text x="120" y="162" font-size="20" font-weight="700" fill="#f1f5f9">1. Upload</text>
    <text x="120" y="188" font-size="13" fill="#94a3b8">PDF · DOCX · TXT</text>
    <text x="120" y="206" font-size="13" fill="#94a3b8">MD · CSV</text>

    <!-- 2 Chunk -->
    <rect x="260" y="125" width="180" height="100" rx="14" fill="#111827" stroke="#818cf8" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="5s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <text x="350" y="162" font-size="20" font-weight="700" fill="#f1f5f9">2. Chunk</text>
    <text x="350" y="188" font-size="13" fill="#94a3b8">500 chars</text>
    <text x="350" y="206" font-size="13" fill="#94a3b8">80 overlap</text>

    <!-- 3 Retrieve -->
    <rect x="490" y="125" width="220" height="100" rx="14" fill="#111827" stroke="#a78bfa" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="5s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <text x="600" y="162" font-size="20" font-weight="700" fill="#f1f5f9">3. Hybrid Retrieval</text>
    <text x="600" y="188" font-size="13" fill="#94a3b8">TF-IDF cosine + BM25</text>
    <text x="600" y="206" font-size="13" fill="#94a3b8">α·vector + (1-α)·BM25</text>

    <!-- 4 LLM -->
    <rect x="760" y="125" width="180" height="100" rx="14" fill="#111827" stroke="#2dd4bf" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="5s" begin="3s" repeatCount="indefinite"/>
    </rect>
    <text x="850" y="162" font-size="20" font-weight="700" fill="#f1f5f9">4. LLM</text>
    <text x="850" y="188" font-size="13" fill="#94a3b8">OpenAI · Claude · Gemini</text>
    <text x="850" y="206" font-size="13" fill="#94a3b8">Groq · DeepSeek · OpenRouter</text>

    <!-- 5 Answer -->
    <rect x="990" y="125" width="180" height="100" rx="14" fill="#111827" stroke="#34d399" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="5s" begin="4s" repeatCount="indefinite"/>
    </rect>
    <text x="1080" y="162" font-size="20" font-weight="700" fill="#f1f5f9">5. Answer</text>
    <text x="1080" y="188" font-size="13" fill="#94a3b8">Streaming reply</text>
    <text x="1080" y="206" font-size="13" fill="#94a3b8">with [S1] [S2] sources</text>
  </g>

  <text x="600" y="285" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">Next.js frontend (:3000) → FastAPI backend (:8000) → your chosen LLM provider</text>
</svg>
