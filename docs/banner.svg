<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="HarryRAG banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#121c3a"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <ellipse cx="600" cy="150" rx="420" ry="120" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- floating particles -->
  <g fill="#60a5fa">
    <circle cx="90"  cy="240" r="3"><animate attributeName="cy" values="260;40;260" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="60"  r="2"><animate attributeName="cy" values="40;270;40" dur="11s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="250" r="2.5"><animate attributeName="cy" values="270;30;270" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="50"  r="3"><animate attributeName="cy" values="40;260;40" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="240" r="2"><animate attributeName="cy" values="270;40;270" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="1110" cy="80" r="3"><animate attributeName="cy" values="50;260;50" dur="9.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="9.5s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#34d399">
    <circle cx="170" cy="150" r="2"><animate attributeName="cx" values="170;200;170" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="170" r="2"><animate attributeName="cx" values="1030;1000;1030" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- title -->
  <text x="600" y="148" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="92" font-weight="800" fill="url(#tg)">HarryRAG
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
  </text>

  <text x="600" y="198" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#cbd5e1" opacity="0">Personal Document Intelligence · Hybrid RAG
    <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="1.2s" fill="freeze"/>
  </text>

  <!-- animated underline -->
  <rect x="450" y="224" height="4" rx="2" fill="url(#tg)" width="0">
    <animate attributeName="width" from="0" to="300" begin="1.2s" dur="1.2s" fill="freeze"/>
  </rect>
</svg>
